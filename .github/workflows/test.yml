name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start Server and Run Full Test Suite
        run: |
          nohup node server.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "Started Node server with PID $SERVER_PID"

          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then
              echo "Server is healthy on http://127.0.0.1:3000"
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "Server failed to start within 30 seconds:"
            cat /tmp/server.log
            exit 1
          fi

          # Run complete test suite against live server
          npm run test:all

      - name: Show Server Log on Failure
        if: failure()
        run: cat /tmp/server.log

